<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Access Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">เข้าสู่ระบบ Access Hub</h2>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">อีเมล</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่าน</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div id="error-message" class="text-red-500 text-sm hidden"></div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ตั้งค่า Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "my-login-project-26857.firebasestorage.app",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ตั้งค่า Persistence เป็น Local
        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Persistence Error:", error);
        });

        // ถ้าเคยล็อกอินอยู่แล้วและมีค่าใน localStorage ให้ดีدข้ามไปหน้า Hub ทันที
        if (localStorage.getItem("isLoggedIn") === "true") {
            window.location.replace("/my-website/Access-Hub.html");
        }

        // จัดการฟอร์ม Login
        const loginForm = document.getElementById("login-form");
        const errorMessage = document.getElementById("error-message");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // บันทึกสถานะลง localStorage ทันทีเพื่อกันลูป
                localStorage.setItem("isLoggedIn", "true");
                // ย้ายไปหน้า Access-Hub
                window.location.replace("/my-website/Access-Hub.html");
            } catch (error) {
                errorMessage.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                errorMessage.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
