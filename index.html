<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7HPOhloICyxEyDTfR8yRiH2rT--q4fVo",
      authDomain: "my-login-project-26857.firebaseapp.com",
      projectId: "my-login-project-26857",
      storageBucket: "my-login-project-26857.firebasestorage.app",
      messagingSenderId: "199741800244",
      appId: "1:199741800244:web:41b413f67038c687dc2f61"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("login-form");
    const errorMessage = document.getElementById("error-message");

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.classList.remove("hidden");
    }

    // ถ้า Firebase ยืนยันว่ามี user อยู่แล้ว ค่อยไปหน้า Hub
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.replace("./Access-Hub.html");
        }
    });

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMessage.classList.add("hidden");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            // รอให้ตั้งค่า persistence เสร็จก่อนล็อกอิน
            await setPersistence(auth, browserLocalPersistence);
            await signInWithEmailAndPassword(auth, email, password);
            // ไม่ต้องสั่งเปลี่ยนหน้าเอง onAuthStateChanged จะจัดการให้
        } catch (error) {
            console.error("Login error:", error.code, error.message);
            switch (error.code) {
                case "auth/invalid-credential":
                case "auth/wrong-password":
                case "auth/user-not-found":
                    showError("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
                    break;
                case "auth/too-many-requests":
                    showError("พยายามล็อกอินหลายครั้งเกินไป กรุณารอสักครู่");
                    break;
                case "auth/network-request-failed":
                    showError("เชื่อมต่อเครือข่ายไม่ได้");
                    break;
                case "auth/unauthorized-domain":
                    showError("โดเมนนี้ยังไม่ได้รับอนุญาตใน Firebase");
                    break;
                default:
                    showError("เกิดข้อผิดพลาด: " + error.code);
            }
        }
    });
</script>
