<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดปุ่มช่วยเหลือพนักงานขับรถ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1b2433;--muted:#6b778c;--line:#e3e8f0;--accent:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--warn:#dc2626;--warnbg:#fee2e2;--head:#eef2f8}
:root[data-theme=dark]{--bg:#0e1420;--card:#171f2e;--text:#e8edf6;--muted:#93a0b8;--line:#263148;--accent:#60a5fa;--ok:#4ade80;--okbg:#14391f;--warn:#f87171;--warnbg:#401c1c;--head:#1d2739}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Thai',system-ui,sans-serif;transition:background .2s}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--muted);font-size:.85rem}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--accent)}
#theme{font-size:1.2rem;padding:6px 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:1.8rem;margin-top:4px}
.kpi span{color:var(--muted);font-size:.85rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=search],input[type=date]{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit}
input[type=search]{flex:1;min-width:200px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrapc{white-space:normal;min-width:180px}
th{background:var(--head);position:sticky;top:0;cursor:pointer;user-select:none}
tr:hover td{background:var(--head)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem}
.yes{background:var(--okbg);color:var(--ok)}
.no{color:var(--muted)}
.al{background:var(--warnbg);color:var(--warn)}
.msg{padding:30px;text-align:center;color:var(--muted)}
.err{color:var(--warn);white-space:pre-wrap;text-align:left;font-size:.8rem}
.foot{margin-top:8px;color:var(--muted);font-size:.8rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-bottom:14px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.chart h3{margin:0 0 12px;font-size:1rem}
.chart h3 small{color:var(--muted);font-weight:400}
.cols{display:flex;gap:4px;height:190px;align-items:flex-end;overflow-x:auto}
.col{flex:1;min-width:26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .b{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.col .b:hover{opacity:1}
.col .v,.col .l{font-size:.7rem;color:var(--muted);height:16px;line-height:16px;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;margin-bottom:7px;font-size:.85rem}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{background:var(--head);border-radius:99px;height:12px;overflow:hidden}
.hf{background:var(--accent);height:100%;border-radius:99px}
.hb b{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🚨 แดชบอร์ดการกดปุ่มช่วยเหลือของพนักงานขับรถ</h1>
      <div class="sub" id="updated">กำลังโหลดข้อมูล…</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="refresh">⟳ รีเฟรช</button>
      <button class="btn" id="theme" title="สลับโทนสว่าง/มืด">🌙</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input type="search" id="q" placeholder="ค้นหา หมายเลขรถ / ชื่อคนขับ / สาเหตุ …">
    <input type="date" id="d1" title="ตั้งแต่วันที่">
    <input type="date" id="d2" title="ถึงวันที่">
  </div>

  <div class="charts">
    <div class="chart"><h3>📅 สถิติรายเดือน <small>(12 เดือนล่าสุด)</small></h3><div id="cMonth"></div></div>
    <div class="chart"><h3>🗓️ สถิติรายวัน <small>(31 วันล่าสุดที่มีข้อมูล)</small></h3><div id="cDay"></div></div>
    <div class="chart"><h3>🏢 สถิติหน่วยงาน <small>(Top 10)</small></h3><div id="cDept"></div></div>
    <div class="chart"><h3>🧑‍✈️ สถิติคนขับ <small>(กดปุ่มบ่อยสุด Top 10)</small></h3><div id="cDriver"></div></div>
  </div>

  <div class="tbl"><table id="t"></table></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw6c8ueZVLvwLiQOg3u0rLNDy1ZsbNPlltNv5cMPSagly5KPpS2jU_LLNFB1Zn6w9w4/exec';

const COLS = [
  {k:'vehicle', t:'หมายเลขรถ'},
  {k:'driver',  t:'ชื่อคนขับ'},
  {k:'alert',   t:'แจ้งเตือน'},
  {k:'date',    t:'วันที่'},
  {k:'time',    t:'เวลาแจ้งเตือน'},
  {k:'dept',    t:'หน่วยงาน'},
  {k:'cause',   t:'สาเหตุ'},
  {k:'rsc',     t:'RSC action'},
  {k:'op',      t:'Operation action'},
  {k:'none',    t:'NO action'}
];
const ACTIONS = ['rsc','op','none'];

// จับคู่หัวคอลัมน์ (ไทย/อังกฤษ) เข้ากับ key ภายใน
function mapKey(h){
  const s = String(h).toLowerCase().replace(/\s+/g,'');
  if (s.includes('rsc')) return 'rsc';
  if (s.includes('operation')) return 'op';
  if (s.startsWith('noaction') || s === 'no') return 'none';
  if (s.includes('หมายเลขรถ') || s.includes('เบอร์รถ') || s.includes('vehicle') || s.includes('ทะเบียน') || s.includes('plate')) return 'vehicle';
  if (s.includes('คนขับ') || s.includes('พขร') || s.includes('driver') || s === 'ชื่อ') return 'driver';
  if (s.includes('เวลา') || s.includes('time')) return 'time';
  if (s.includes('วันที่') || s.includes('date')) return 'date';
  if (s.includes('หน่วยงาน') || s.includes('department')) return 'dept';
  if (s.includes('สาเหตุ') || s.includes('cause') || s.includes('reason')) return 'cause';
  if (s.includes('แจ้งเตือน') || s.includes('alert')) return 'alert';
  return null;
}

// แปลงข้อมูล API ให้เป็น [{provider, vehicle, ...}] ไม่ว่าโครงสร้าง JSON จะเป็นแบบใด
function normalize(json){
  const out = [];
  const addRows = (name, rows) => {
    if (!Array.isArray(rows) || !rows.length) return;
    let objs = rows;
    if (Array.isArray(rows[0])) {            // แบบ array ของ array (แถวแรกเป็นหัวตาราง)
      const hdr = rows[0];
      objs = rows.slice(1).map(r => Object.fromEntries(hdr.map((h,i)=>[h,r[i]])));
    }
    objs.forEach(o => {
      if (!o || typeof o !== 'object') return;
      const r = {provider: name};
      for (const [h,v] of Object.entries(o)) {
        const k = mapKey(h);
        if (k && (r[k] === undefined || r[k] === '')) r[k] = v;
        if (/provider|ผู้ให้บริการ|sheet/i.test(h) && v) r.provider = String(v);
      }
      if (r.vehicle || r.driver || r.date || r.cause) out.push(r);
    });
  };
  const walk = (node, name) => {
    if (Array.isArray(node)) return addRows(name, node);
    if (node && typeof node === 'object')
      for (const [k,v] of Object.entries(node)) walk(v, Array.isArray(v) ? k : (name || k));
  };
  walk(json, 'ทั้งหมด');
  out.forEach(r => { r.provider = /dtc/i.test(r.provider) ? 'DTC' : /song/i.test(r.provider) ? 'Songdee' : r.provider; });
  return out;
}

const isoRe = /^\d{4}-\d{2}-\d{2}T/;
function fmtDate(v){
  if (v === undefined || v === null || v === '') return '';
  if (isoRe.test(v)) return new Date(v).toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
  const s = String(v).trim(), p2 = n => String(n).padStart(2,'0');
  const fixY = y => +y > 2400 ? +y - 543 : +y;   // ปี พ.ศ. -> ค.ศ.
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return `${fixY(m[1])}-${p2(m[2])}-${p2(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);   // วัน/เดือน/ปี
  if (m) return `${fixY(m[3])}-${p2(m[2])}-${p2(m[1])}`;
  return s;
}
function fmtTime(v){
  if (v === undefined || v === null || v === '') return '';
  if (isoRe.test(v)) return new Date(v).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  return String(v);
}
const hasVal = v => v !== undefined && v !== null && String(v).trim() !== '' && !/^(false|no|-|0|ไม่มี)$/i.test(String(v).trim());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let ALL = [], tab = 'ทั้งหมด', sortK = 'date', sortDir = -1;
const $ = id => document.getElementById(id);

function filtered(){
  const q = $('q').value.trim().toLowerCase(), d1 = $('d1').value, d2 = $('d2').value;
  return ALL.filter(r => {
    if (tab !== 'ทั้งหมด' && r.provider !== tab) return false;
    const d = fmtDate(r.date);
    if (d1 && d < d1) return false;
    if (d2 && d > d2) return false;
    return !q || [r.vehicle,r.driver,r.alert,r.dept,r.cause].join(' ').toLowerCase().includes(q);
  });
}

// ---------- กราฟ ----------
const EMPTY = '<div class="msg">ไม่มีข้อมูล</div>';
const tally = (rows, f) => { const m = {}; rows.forEach(r => { const k = f(r); if (k) m[k] = (m[k]||0) + 1; }); return m; };

function colChart(id, entries, every){
  const max = Math.max(1, ...entries.map(e => e[1]));
  $(id).innerHTML = entries.length
    ? '<div class="cols">' + entries.map(([l,v,tip],i) =>
        `<div class="col" title="${esc(tip||l)}: ${v} ครั้ง"><span class="v">${v||''}</span>` +
        `<div class="b" style="height:calc((100% - 32px) * ${v/max})"></div>` +
        `<span class="l">${i % every === 0 ? esc(l) : ''}</span></div>`).join('') + '</div>'
    : EMPTY;
}
function hbar(id, entries, n){
  const top = entries.slice(0,n), max = Math.max(1, ...top.map(e => e[1]));
  $(id).innerHTML = top.length ? top.map(([l,v]) =>
    `<div class="hb"><span class="hl" title="${esc(l)}">${esc(l)}</span>` +
    `<div class="ht"><div class="hf" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join('') : EMPTY;
}

function drawCharts(rows){
  const dateOk = d => /^\d{4}-\d{2}-\d{2}$/.test(d);
  const dates = rows.map(r => fmtDate(r.date)).filter(dateOk);

  // รายเดือน (12 เดือนล่าสุด)
  const mt = {}; dates.forEach(d => { const k = d.slice(0,7); mt[k] = (mt[k]||0) + 1; });
  const months = Object.keys(mt).sort().slice(-12).map(k => {
    const [y,m] = k.split('-');
    return [new Date(+y, +m-1, 1).toLocaleDateString('th-TH',{month:'short',year:'2-digit'}), mt[k]];
  });
  colChart('cMonth', months, 1);

  // รายวัน (31 วันล่าสุด นับจากวันที่ล่าสุดที่มีข้อมูล)
  if (dates.length) {
    const dt = {}; dates.forEach(d => dt[d] = (dt[d]||0) + 1);
    const [y,m,d] = dates.reduce((a,b) => a > b ? a : b).split('-').map(Number);
    const days = [];
    for (let i = 30; i >= 0; i--) {
      const x = new Date(Date.UTC(y, m-1, d - i)), key = x.toISOString().slice(0,10);
      days.push([`${x.getUTCDate()}/${x.getUTCMonth()+1}`, dt[key] || 0, key]);
    }
    colChart('cDay', days, 3);
  } else colChart('cDay', [], 1);

  // หน่วยงาน / คนขับ
  const sortDesc = o => Object.entries(o).sort((a,b) => b[1] - a[1]);
  hbar('cDept',   sortDesc(tally(rows, r => String(r.dept ?? '').trim() || '(ไม่ระบุ)')), 10);
  hbar('cDriver', sortDesc(tally(rows, r => String(r.driver ?? '').trim())), 10);
}

function render(){
  // แท็บผู้ให้บริการ
  const provs = ['ทั้งหมด', ...new Set(ALL.map(r => r.provider).filter(p => p !== 'ทั้งหมด'))];
  $('tabs').innerHTML = provs.map(p => `<button class="btn tab ${p===tab?'on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.p; render(); });

  const rows = filtered().sort((a,b) => {
    const x = sortK==='date' ? fmtDate(a.date)+fmtTime(a.time) : String(a[sortK] ?? '');
    const y = sortK==='date' ? fmtDate(b.date)+fmtTime(b.time) : String(b[sortK] ?? '');
    return x.localeCompare(y, 'th', {numeric:true}) * sortDir;
  });

  // KPI
  const cnt = k => rows.filter(r => hasVal(r[k])).length;
  const uniq = new Set(rows.map(r => r.vehicle)).size;
  const noAny = rows.filter(r => !ACTIONS.some(k => hasVal(r[k]))).length;
  $('kpis').innerHTML = [
    ['จำนวนการแจ้งเตือน', rows.length], ['รถที่กดปุ่ม (คัน)', uniq],
    ['RSC ติดต่อ', cnt('rsc')], ['Operation ติดต่อ', cnt('op')], ['NO action', cnt('none')], ['ยังไม่มีการติดต่อ', noAny]
  ].map(([l,v]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');

  drawCharts(rows);

  // ตาราง
  const head = COLS.map(c => `<th data-k="${c.k}">${c.t}${sortK===c.k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('');
  const body = rows.map(r => '<tr>' + COLS.map(c => {
    if (ACTIONS.includes(c.k)) {
      const v = r[c.k];
      return `<td>${hasVal(v) ? `<span class="pill yes">${/^(true|yes|y|✓|1)$/i.test(String(v).trim()) ? '✓ ติดต่อแล้ว' : esc(v)}</span>` : '<span class="no">–</span>'}</td>`;
    }
    if (c.k === 'alert') return `<td><span class="pill al">${esc(r.alert)}</span></td>`;
    if (c.k === 'date') return `<td>${esc(fmtDate(r.date))}</td>`;
    if (c.k === 'time') return `<td>${esc(fmtTime(r.time))}</td>`;
    return `<td class="${c.k==='cause'?'wrapc':''}">${esc(r[c.k])}</td>`;
  }).join('') + '</tr>').join('');
  $('t').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${COLS.length}" class="msg">ไม่พบข้อมูล</td></tr>`}</tbody>`;
  $('t').querySelectorAll('th').forEach(th => th.onclick = () => {
    sortDir = sortK === th.dataset.k ? -sortDir : 1; sortK = th.dataset.k; render();
  });
  const per = {}; ALL.forEach(r => per[r.provider] = (per[r.provider]||0) + 1);
  $('foot').textContent = `แสดง ${rows.length} จาก ${ALL.length} รายการ · ชีทที่โหลดได้: ` +
    Object.entries(per).map(([k,v]) => `${k} (${v})`).join(', ');
}

async function load(){
  $('updated').textContent = 'กำลังโหลดข้อมูล…';
  try {
    const res = await fetch(API, {redirect:'follow'});
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch(e){ throw new Error('API ไม่ได้ส่ง JSON กลับมา — ตรวจสอบว่า deploy เป็น "ทุกคนเข้าถึงได้" และ doGet ส่ง JSON\n\n' + text.slice(0,300)); }
    ALL = normalize(json);
    if (!ALL.length) throw new Error('อ่านข้อมูลได้แต่ไม่พบแถวข้อมูล โครงสร้างที่ได้:\n' + JSON.stringify(json).slice(0,400));
    $('updated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleString('th-TH');
    render();
  } catch(e) {
    $('updated').textContent = 'โหลดข้อมูลไม่สำเร็จ';
    $('t').innerHTML = `<tbody><tr><td class="msg err">${esc(e.message)}</td></tr></tbody>`;
  }
}

// โทนมืด/สว่าง
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch(e){}
}
let saved = null; try { saved = localStorage.getItem('theme'); } catch(e){}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

$('refresh').onclick = load;
['q','d1','d2'].forEach(id => $(id).oninput = render);
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
