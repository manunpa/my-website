  <title>Customer Stations Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <style>
  body, html, #app {
    height: 100%; margin: 0;
    background: linear-gradient(135deg, #f3f4f6, #e5e7eb); /* ปรับพื้นหลังเป็นโทนสว่าง */
    color: #1f2937; /* ปรับสีตัวหนังสือหลักให้เข้มขึ้นเพื่อให้อ่านง่าย */
    font-family: 'Courier New', monospace;
  }
  #map {
    height: 100%;
    border-radius: 0 0 0.5rem 0;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  }/* ลวดลายกราฟิกโทนเทา-ขาวสำหรับ Header */
.header-pattern {
  background-color: #ffffff;
  background-image: linear-gradient(90deg, #f1f5f9 1px, transparent 1px), 
                    linear-gradient(180deg, #f1f5f9 1px, transparent 1px);
  background-size: 20px 20px;
}
  #leftPanel::-webkit-scrollbar { width: 8px; }
  #leftPanel::-webkit-scrollbar-thumb {
    background-color: #9ca3af;
    border-radius: 4px;
  }
  @media (max-width: 768px) {
    #app > div.flex-1 { flex-direction: column; height: 100%; }
    #leftPanel {
      width: 100% !important;
      height: 200px;
      border-right: none;
      border-bottom: 2px solid #d1d5db;
      overflow-x: auto; overflow-y: hidden;
      flex-shrink: 0;
    }
    main {
      height: calc(100% - 200px);
      flex: 1 1 auto; min-height: 0;
    }
  }

  /* ✅ สีตัวเลขในวงกลม cluster เป็นสีดำเหมือนเดิม */
  .marker-cluster div {
    color: black !important;
  }
</style>
  
</head>
<body>
<div id="app" class="flex flex-col h-full">
  <header class="header-pattern flex items-center justify-between bg-white text-gray-800 px-6 py-6 shadow-md border-b border-gray-200">
    <div class="text-xl font-semibold tracking-wide">🛡️ Customer Stations Map</div>
    <div class="flex items-center space-x-6">
        <nav class="flex flex-col items-end gap-y-2 text-gray-600">
            <!-- แถวที่ 1 -->
            <div class="flex items-center space-x-6">
                <button class="hover:text-blue-600 transition">Home</button>
                <a href="alert-rate.html" class="hover:text-blue-600 transition">alert-rate</a>
                <a href="http://103.228.55.220/SDFMSV20/login/logout" target="_blank" class="hover:text-blue-600 transition">FMS</a>
                <a href="https://hosting.wialon.eu/?lang=en" target="_blank" class="hover:text-blue-600 transition">Wialon</a>
                <a href="https://gps.dtc.co.th/v2/login" target="_blank" class="hover:text-blue-600 transition">DTC</a>
                <a href="https://www.ezview.asia/" target="_blank" class="hover:text-blue-600 transition">MappoinAsia</a>
                <a href="https://tttwli.com/login.html" target="_blank" class="hover:text-blue-600 transition">Smart Logistics</a>
            </div>

            <!-- แถวที่ 2 (กรอบสีน้ำเงิน) -->
            <div class="flex items-center space-x-6 text-sm">
                <a href="http://203.151.66.75:9966/vss/#" target="_blank" class="hover:text-blue-600 transition">VSSSONGDEE</a>
                <a href="http://203.150.48.47:9966/vss/#" target="_blank" class="hover:text-blue-600 transition">VSSPMS</a>
                <a href="https://cms.dtc.co.th/login" target="_blank" class="hover:text-blue-600 transition">CMSV.2Monitor</a>
                <a href="https://dvrai.net/808gps/login.html" target="_blank" class="hover:text-blue-600 transition">CMSV6</a>
                <a href="https://bcpleoorder.bangchak.co.th:8000/auth/login/" target="_blank" class="hover:text-blue-600 transition">LEO</a>
            </div>
        </nav>

        <!-- ปุ่ม Logout -->
        <button id="logoutBtn" class="ml-8 px-5 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition shadow-lg border">
            Logout
        </button>
    </div>
</header>

<!-- โครงสร้างหน้าเว็บหลัก (Sidebar ด้านซ้าย และ Map ด้านขวา) -->
<div class="flex-1 overflow-hidden flex">
    <aside id="leftPanel" class="w-72 bg-gray-50 text-gray-800 p-4 overflow-y-auto border-r border-gray-200 flex flex-col">
        <div class="flex items-center justify-between mb-4">
            <h2 class="font-bold text-gray-700 text-lg">🚚 Station List</h2>
            <button id="togglePanelBtn" class="text-xs bg-gray-200 hover:bg-gray-300 px-2.5 py-1 rounded">ซ่อน</button>
        </div>
        <input type="text" id="searchInput" placeholder="ค้นหาสถานี..." class="mb-4 p-2 rounded bg-white border border-gray-300 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        <ul id="vehicleList" class="space-y-3 overflow-y-auto flex-1"></ul>
    </aside>
    
    <main class="flex-1 relative flex flex-col">
        <div class="p-2 bg-white text-gray-700 flex items-center space-x-3 border-b border-gray-200 shadow-sm">
            <label for="layerSelect" class="font-semibold select-none">แผนที่:</label>
            <select id="layerSelect" class="bg-gray-50 border border-gray-300 text-gray-800 rounded px-2 py-1 focus:outline-none">
                <option value="osm">OpenStreetMap</option>
                <option value="satellite">ดาวเทียม</option>
            </select>
        </div>
        <div id="map" class="flex-1"></div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7HPOhloICyxEyDTfR8yRiH2rT--q4fVo",
    authDomain: "my-login-project-26857.firebaseapp.com",
    projectId: "my-login-project-26857",
    storageBucket: "my-login-project-26857.appspot.com",
    messagingSenderId: "199741800244",
    appId: "1:199741800244:web:41b413f67038c687dc2f61"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, user => {
  if (!user) {
    alert("🚫 Access denied. Please log in first.");
    window.location.href = "index.html";
  } else {
    // ✅ เริ่มจับเวลาเมื่อยืนยันว่า user ล็อกอินแล้ว
    setTimeout(async () => {
      try {
        await signOut(auth);
        alert("⏳ Session expired. You have been logged out.");
        window.location.href = "index.html";
      } catch (error) {
        alert("❌ Auto logout failed: " + error.message);
        window.location.href = "index.html";
      }
    }, 10 * 60 * 1000); // 10 นาที
  }
});


  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      alert("👋 Logged out successfully!");
      window.location.href = "index.html";
    } catch (error) {
      alert("❌ Logout failed: " + error.message);
    }
  });

  let vehicles = [];
  const markers = L.markerClusterGroup();
  const map = L.map('map').setView([13.7563, 100.5018], 13);

  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  });

  const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri — Source: Esri'
  });

  osmLayer.addTo(map);
  map.addLayer(markers);

  document.getElementById('layerSelect').addEventListener('change', e => {
    map.eachLayer(layer => map.removeLayer(layer));
    if (e.target.value === 'osm') osmLayer.addTo(map);
    else if (e.target.value === 'satellite') satelliteLayer.addTo(map);
    map.addLayer(markers);
  });

  const carIcon = L.icon({
    iconUrl: 'https://www.freepnglogos.com/uploads/mr-bean-png/mr-bean-bean-waving-transparent-png-stickpng-2.png',
    iconSize: [40, 40],
    iconAnchor: [20, 20],
    popupAnchor: [0, -20]
  });

  const vehicleListEl = document.getElementById('vehicleList');
  const searchInput = document.getElementById('searchInput');

  function displayVehicles(filter = '') {
    vehicleListEl.innerHTML = '';
    markers.clearLayers();
    const filtered = vehicles.filter(v => v.name.toLowerCase().includes(filter.toLowerCase()));
    filtered.forEach(v => {
      const li = document.createElement('li');
      li.textContent = v.name;
      li.className = 'cursor-pointer px-3 py-2 rounded bg-white border border-gray-200 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition shadow-sm';
      li.onclick = () => {
        map.setView([v.lat, v.lng], 15);
      };
      vehicleListEl.appendChild(li);

      const marker = L.marker([v.lat, v.lng], { icon: carIcon })
        .bindPopup(`<b>${v.name}</b><br>Lat: ${v.lat.toFixed(6)}<br>Lng: ${v.lng.toFixed(6)}`)
        .bindTooltip(`Lat: ${v.lat.toFixed(6)}, Lng: ${v.lng.toFixed(6)}`);
      markers.addLayer(marker);
    });
  }

  let searchMarker = null; // ตัวแปรเก็บหมุดค้นหาล่าสุด

searchInput.addEventListener('input', e => {
    const query = e.target.value.trim();
    
    // ตรวจสอบและแปลงค่าพิกัด ละติจูด, ลองจิจูด
    const coords = query.split(',').map(item => parseFloat(item.trim()));
    if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
        // ถ้าเคยมีหมุดค้นหาเก่าอยู่ ให้ลบออกจากแผนที่ก่อน
        if (searchMarker) {
            map.removeLayer(searchMarker);
        }
        
        // ย้ายแผนที่ไปยังพิกัดใหม่
        map.setView([coords[0], coords[1]], 15);
        
        // ปักหมุดใหม่และเก็บไว้ในตัวแปร searchMarker
        searchMarker = L.marker([coords[0], coords[1]])
            .addTo(map)
            .bindPopup(`<b>พิกัดที่ค้นหา</b><br>Lat: ${coords[0]}<br>Lng: ${coords[1]}`)
            .openPopup();
    } else {
        // ถ้าลบข้อความออก หรือพิมพ์รูปแบบอื่นที่ไม่ใช่พิกัด ให้ลบหมุดค้นหาออกด้วย
        if (searchMarker) {
            map.removeLayer(searchMarker);
            searchMarker = null;
        }
    }
    
    displayVehicles(query);
});
    

  async function loadCSV() {
    try {
      const response = await fetch('data/stations.csv');
      if (!response.ok) throw new Error('Failed to load CSV data');
      const csvText = await response.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      vehicles = parsed.data.map(row => ({
        name: row.name || row.Name || row.NAME,
        lat: parseFloat(row.lat || row.Lat || row.LAT),
        lng: parseFloat(row.lng || row.Lng || row.LNG)
      })).filter(v => v.name && !isNaN(v.lat) && !isNaN(v.lng));
      displayVehicles();
    } catch (err) {
      alert("❌ Error loading station data: " + err.message);
    }
  }

  loadCSV();
  document.getElementById('togglePanelBtn').addEventListener('click', () => {
  const leftPanel = document.getElementById('leftPanel');
  const btn = document.getElementById('togglePanelBtn');
  
  leftPanel.classList.toggle('hidden');
  btn.textContent = leftPanel.classList.contains('hidden') ? 'แสดงแถบ' : 'ซ่อน';
  
  setTimeout(() => { map.invalidateSize(); }, 200);
});
</script>
</body>
</html>
