<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --line: #e2e2de;
    --text: #1a1a1a;
    --muted: #7a7a75;
    --accent: #1a1a1a;
    --accent-text: #ffffff;
    --dot: #d6d6d1;
    --spot: rgba(0,0,0,.055);
    --shadow: 0 8px 24px -10px rgba(0,0,0,.18);
  }
  :root[data-theme="dark"] {
    --bg: #161616;
    --surface: #1f1f1f;
    --line: #2e2e2e;
    --text: #ececea;
    --muted: #8d8d88;
    --accent: #ececea;
    --accent-text: #161616;
    --dot: #2c2c2c;
    --spot: rgba(255,255,255,.07);
    --shadow: 0 8px 24px -10px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    transition: background .3s, color .3s;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
            mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 64px 24px 56px;
  }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 56px;
  }
  .clock { font-size: .88rem; color: var(--muted); font-weight: 300; font-variant-numeric: tabular-nums; }
  .clock b { color: var(--text); font-weight: 500; }

  .theme {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    cursor: pointer; display: grid; place-items: center;
    transition: transform .4s cubic-bezier(.4,1.6,.5,1), border-color .2s;
  }
  .theme:hover { transform: rotate(35deg); border-color: var(--muted); }
  .theme svg { width: 18px; height: 18px; }
  .theme .moon { display: none; }
  :root[data-theme="dark"] .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .moon { display: block; }

  header { margin-bottom: 36px; }
  h1 {
    font-size: clamp(2.4rem, 7vw, 3.75rem);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.1;
  }
  .typed::after {
    content: "";
    display: inline-block;
    width: .08em; height: .85em;
    background: var(--text);
    margin-left: .12em;
    vertical-align: -.05em;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  header p { margin-top: 12px; color: var(--muted); font-weight: 300; }

  .search {
    position: relative; margin-bottom: 44px; max-width: 460px;
  }
  .search input {
    width: 100%;
    font: inherit; font-size: .98rem; color: var(--text);
    padding: 13px 52px 13px 44px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::placeholder { color: var(--muted); font-weight: 300; }
  .search input:focus { border-color: var(--text); box-shadow: 0 0 0 4px var(--spot); }
  .search svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--muted);
  }
  .search kbd {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: .75rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 0 7px;
  }
  .empty { display: none; color: var(--muted); font-weight: 300; padding: 8px 0 24px; }

  section { margin-bottom: 40px; }
  h2 {
    font-size: .95rem; font-weight: 500; color: var(--muted);
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  h2 small { font-weight: 300; font-size: .82rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
  }

  .btn {
    --mx: 50%; --my: 50%;
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .2s;
  }
  .btn::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(180px circle at var(--mx) var(--my), var(--spot), transparent 70%);
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--muted); }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(-1px) scale(.985); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .icon {
    position: relative; flex: none;
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 1.15rem;
    transition: background .25s, color .25s, transform .35s cubic-bezier(.4,1.6,.5,1), border-color .25s;
  }
  .btn:hover .icon {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent); transform: rotate(-8deg) scale(1.06);
  }

  .label { min-width: 0; flex: 1; position: relative; }
  .label strong {
    display: block; font-weight: 500; font-size: 1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .label span { display: block; font-size: .82rem; color: var(--muted); font-weight: 300; }

  .go {
    position: relative; flex: none; width: 18px; height: 18px; color: var(--muted);
    opacity: 0; transform: translate(-6px, 6px);
    transition: opacity .25s, transform .25s;
  }
  .btn:hover .go { opacity: 1; transform: none; color: var(--text); }

  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary .label span, .btn.primary .go { color: var(--accent-text); opacity: .6; }
  .btn.primary:hover .go { opacity: 1; color: var(--accent-text); }
  .btn.primary .icon { background: transparent; border-color: rgba(128,128,128,.45); color: var(--accent-text); }
  .btn.primary:hover .icon { background: var(--accent-text); color: var(--accent); border-color: var(--accent-text); }
  .btn.primary::before { background: radial-gradient(180px circle at var(--mx) var(--my), rgba(255,255,255,.14), transparent 70%); }
  :root[data-theme="dark"] .btn.primary::before { background: radial-gradient(180px circle at var(--mx) var(--my), rgba(0,0,0,.12), transparent 70%); }

  footer { margin-top: 56px; font-size: .82rem; color: var(--muted); font-weight: 300; }

  .reveal { opacity: 0; transform: translateY(14px); animation: up .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes up { to { opacity: 1; transform: none; } }

  @media (max-width: 520px) {
    .wrap { padding: 36px 18px 40px; }
    .grid { grid-template-columns: 1fr; }
    .search kbd { display: none; }
    .go { opacity: .5; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top reveal" style="--i:0">
    <div class="clock" id="clock"></div>
    <button class="theme" id="theme" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <header class="reveal" style="--i:1">
    <h1 id="title" class="typed" aria-label="Access Hub"></h1>
    <p id="greet">ศูนย์รวมช่องทางการเข้าถึงระบบงาน</p>
  </header>

  <div class="search reveal" style="--i:2">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ค้นหาลิงก์…" autocomplete="off" aria-label="ค้นหาลิงก์">
    <kbd>/</kbd>
  </div>
  <p class="empty" id="empty">ไม่พบลิงก์ที่ตรงกับคำค้น</p>

  <section class="reveal" style="--i:3">
    <h2>กลุ่มที่ 1</h2>
    <div class="grid">
      <a class="btn primary" href="#" target="_blank" rel="noopener">
        <div class="icon">★</div>
        <div class="label"><strong>ลิงก์หลัก</strong><span>คำอธิบายสั้นๆ</span></div>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
      <a class="btn" href="#" target="_blank" rel="noopener">
        <div class="icon">◆</div>
        <div class="label"><strong>ปุ่มที่ 2</strong><span>คำอธิบายสั้นๆ</span></div>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
      <a class="btn" href="#" target="_blank" rel="noopener">
        <div class="icon">●</div>
        <div class="label"><strong>ปุ่มที่ 3</strong><span>คำอธิบายสั้นๆ</span></div>
        <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
    </div>
  </section>

  <footer class="reveal" style="--i:4">กด / เพื่อค้นหา · Esc เพื่อล้างคำค้น</footer>
</div>

<!-- Firebase App & Auth SDK -->
<!-- Firebase App & Auth SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7HPOhIoICyXEyDTFR8yRiH2rT--q4FVo",
    authDomain: "my-login-project-26857.firebaseapp.com",
    projectId: "my-login-project-26857",
    storageBucket: "my-login-project-26857.appspot.com",
    messagingSenderId: "199741800244",
    appId: "1:199741800244:web:41b413f67038c687dc2f61"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ป้องกันหน้ากะพริบ: ซ่อนเนื้อหาเว็บไว้ก่อนจนกว่าจะเช็ก Auth เสร็จ
  document.body.style.visibility = "hidden";

  // ใช้ onAuthStateChanged ตรวจสอบสถานะอย่างแม่นยำ
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // ถ้ามี User ล็อกอินอยู่ ปล่อยให้แสดงหน้าเว็บปกติ
      document.body.style.visibility = "visible";
    } else {
      // ถ้าไม่มี User จริงๆ ถึงค่อยดีดกลับหน้า Login
      window.location.replace("/my-website/index.html");
    }
  });

  // ระบบนับถอยหลัง 10 นาทีแบบตายตัว
  const SESSION_TIMEOUT = 10 * 60 * 1000; // 10 นาที
  setTimeout(() => {
    alert("หมดเวลาการใช้งาน ระบบจะนำท่านกลับสู่หน้าเข้าสู่ระบบ");
    signOut(auth).then(() => {
      window.location.replace("/my-website/index.html");
    });
  }, SESSION_TIMEOUT);
</script>

<script>
(function () {
  var root = document.documentElement;

  try { if (localStorage.getItem("hub-theme") === "dark") root.setAttribute("data-theme", "dark"); } catch (e) {}
  document.getElementById("theme").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") !== "dark";
    if (dark) root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
    try { localStorage.setItem("hub-theme", dark ? "dark" : "light"); } catch (e) {}
  });

  var clock = document.getElementById("clock");
  var greet = document.getElementById("greet");
  var days = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  var months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var d = new Date();
    clock.innerHTML = "วัน" + days[d.getDay()] + "ที่ " + d.getDate() + " " + months[d.getMonth()] + " " + (d.getFullYear() + 543) +
      " &nbsp;<b>" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + "</b>";
    var h = d.getHours();
    greet.textContent = (h < 5 ? "ดึกแล้ว พักผ่อนบ้างนะ" : h < 12 ? "อรุณสวัสดิ์ วันนี้เริ่มจากตรงไหนดี" : h < 17 ? "สวัสดียามบ่าย" : h < 21 ? "สวัสดียามเย็น" : "สวัสดียามค่ำ");
  }
  tick(); setInterval(tick, 20000);

  var title = document.getElementById("title");
  var text = "Access Hub", i = 0;
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) { title.textContent = text; title.classList.remove("typed"); }
  else {
    setTimeout(function type() {
      title.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(type, 140);
      else setTimeout(function () { title.classList.remove("typed"); }, 1800);
    }, 450);
  }

  var cards = Array.prototype.slice.call(document.querySelectorAll(".btn"));
  cards.forEach(function (c) {
    c.addEventListener("pointermove", function (e) {
      var r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (e.clientX - r.left) + "px");
      c.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
  });

  var q = document.getElementById("q");
  var empty = document.getElementById("empty");
  var sections = Array.prototype.slice.call(document.querySelectorAll("section"));
  function filter() {
    var term = q.value.trim().toLowerCase(), shown = 0;
    cards.forEach(function (c) {
      var ok = !term || c.textContent.toLowerCase().indexOf(term) > -1;
      c.style.display = ok ? "" : "none";
      if (ok) shown++;
    });
    sections.forEach(function (s) {
      var any = Array.prototype.some.call(s.querySelectorAll(".btn"), function (c) { return c.style.display !== "none"; });
      s.style.display = any ? "" : "none";
    });
    empty.style.display = shown ? "none" : "block";
  }
  q.addEventListener("input", filter);
  q.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { q.value = ""; filter(); q.blur(); }
    if (e.key === "Enter") {
      var first = cards.filter(function (c) { return c.style.display !== "none"; })[0];
      if (first) first.click();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
})();
</script>
</body>
</html>
