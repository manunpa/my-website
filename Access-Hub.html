<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Hub - Dashboard</title>
    <!-- ซ่อนหน้าจอไว้ก่อนเพื่อกันการกระพริบ -->
    <style>body { visibility: hidden; }</style>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Access Hub</h1>
        <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
            ออกจากระบบ
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-6">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">ยินดีต้อนรับสู่ระบบภายใน</h2>
        <p class="text-gray-600">เลือกเมนูลัดด้านล่างเพื่อใช้งานระบบต่างๆ</p>
        
        <!-- Grid เมนูตัวอย่าง -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
            <div class="bg-white p-6 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2">ระบบจัดการงาน</h3>
                <p class="text-gray-500 text-sm">เข้าสู่ระบบบริหารจัดการโปรเจกต์ภายในองค์กร</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2">ระบบทรัพยากรบุคคล</h3>
                <p class="text-gray-500 text-sm">ตรวจสอบวันลาและข้อมูลพนักงาน</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2">คลังเอกสาร</h3>
                <p class="text-gray-500 text-sm">ดาวน์โหลดแบบฟอร์มและเอกสารสำคัญ</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Scripts & Security Guard -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "my-login-project-26857.firebasestorage.app",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. เช็กสิทธิ์จาก localStorage ก่อนทันทีเพื่อความเร็วและกันลูป
        const localAuth = localStorage.getItem("isLoggedIn");
        if (!localAuth) {
            window.location.replace("/my-website/index.html");
        } else {
            // ถ้าผ่าน ให้แสดงผลหน้าเว็บทันที
            document.body.style.visibility = "visible";
        }

        // 2. ตรวจสอบสถานะจริงจาก Firebase ซ้ำอีกรอบเพื่อความปลอดภัย
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                localStorage.removeItem("isLoggedIn");
                window.location.replace("/my-website/index.html");
            }
        });

        // 3. ระบบ Logout
        document.getElementById("logout-btn").addEventListener("click", () => {
            signOut(auth).then(() => {
                localStorage.removeItem("isLoggedIn");
                window.location.replace("/my-website/index.html");
            }).catch((error) => {
                console.error("Logout Error:", error);
            });
        });

        // --- ระบบตัด Session อัตโนมัติ (10 นาที) ---
        let inactivityTime = function () {
            let time;
            function resetTimer() {
                clearTimeout(time);
                time = setTimeout(logoutDueToInactivity, 10 * 60 * 1000); // 10 นาที (หน่วยเป็นมิลลิวินาที)
            }

            function logoutDueToInactivity() {
                alert("หมดเวลาการใช้งานเนื่องจากไม่มีการเคลื่อนไหว กรุณาล็อกอินใหม่อีกครั้ง");
                signOut(auth).then(() => {
                    localStorage.removeItem("isLoggedIn");
                    window.location.replace("/my-website/index.html");
                });
            }

            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeypress = resetTimer;
            document.onclick = resetTimer;
            document.onscroll = resetTimer;
        };
        inactivityTime();
    </script>
</body>
</html>
