<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Hub - Dashboard</title>
    <!-- ซ่อนหน้าจอไว้ก่อนเพื่อกันการกระพริบ -->
    <style>body { visibility: hidden; }</style>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Access Hub</h1>
        <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
            ออกจากระบบ
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-6">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">ยินดีต้อนรับสู่ระบบภายใน</h2>
        <p class="text-gray-600">เลือกเมนูลัดด้านล่างเพื่อใช้งานระบบต่างๆ</p>
        
        <!-- Grid เมนูตัวอย่าง -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
            <div class="bg-white p-6 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2">ระบบจัดการงาน</h3>
                <p class="text-gray-500 text-sm">เข้าสู่ระบบบริหารจัดการโปรเจกต์ภายในองค์กร</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2">ระบบทรัพยากรบุคคล</h3>
                <p class="text-gray-500 text-sm">ตรวจสอบวันลาและข้อมูลพนักงาน</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border">
                <h3 class="font-bold text-lg mb-2">คลังเอกสาร</h3>
                <p class="text-gray-500 text-sm">ดาวน์โหลดแบบฟอร์มและเอกสารสำคัญ</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Scripts & Security Guard -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7HPOhloICyxEyDTfR8yRiH2rT--q4fVo",
        authDomain: "my-login-project-26857.firebaseapp.com",
        projectId: "my-login-project-26857",
        storageBucket: "my-login-project-26857.firebasestorage.app",
        messagingSenderId: "199741800244",
        appId: "1:199741800244:web:41b413f67038c687dc2f61"
    };

    const LOGIN_URL = "./index.html";
    const INACTIVITY_LIMIT = 10 * 60 * 1000;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.body.style.visibility = "visible";
            startInactivityTimer();
        } else {
            window.location.replace(LOGIN_URL);
        }
    });

    async function doLogout() {
        try { await signOut(auth); }
        catch (error) { console.error("Logout Error:", error); }
    }

    document.getElementById("logout-btn").addEventListener("click", doLogout);

    let inactivityStarted = false;
    function startInactivityTimer() {
        if (inactivityStarted) return;
        inactivityStarted = true;
        let timer;
        function reset() {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                alert("หมดเวลาการใช้งานเนื่องจากไม่มีการเคลื่อนไหว กรุณาล็อกอินใหม่อีกครั้ง");
                await doLogout();
            }, INACTIVITY_LIMIT);
        }
        ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach((evt) =>
            window.addEventListener(evt, reset, { passive: true })
        );
        reset();
    }
</script>
</body>
</html>
