<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดตรวจสอบการแจ้งเตือนอุปกรณ์เทียบระยะทาง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--panel:#fff;--line:#d5dfe3;--ink:#12222c;--mute:#5c7380;--accent:#0b7a75;--hi:#c93a2d;--lo:#a86b00;--zero:#4457c7;--ok:#1b8a57;--shadow:0 1px 2px rgba(18,34,44,.06)}
:root[data-theme=dark]{--bg:#0e1a22;--panel:#15252f;--line:#25394a;--ink:#e6eef2;--mute:#8fa6b3;--accent:#3fc1b0;--hi:#ff6b5e;--lo:#f2b84b;--zero:#8fa4ff;--ok:#4cc38a;--shadow:none}
*{box-sizing:border-box}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;line-height:1.55;font-size:15px}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.btns{display:flex;gap:8px}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme=dark] .btn.primary{color:#06201d}
.icon{width:18px;height:18px}
html[data-theme=light] .moon,html[data-theme=dark] .sun{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 4px}
.panel .hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.filters select,.filters input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:26px;line-height:1.2;font-weight:700}
.kpi span{color:var(--mute);font-size:13px}
.kpi.avg{border-color:var(--accent);border-width:2px}
.kpi.avg b{color:var(--accent);font-size:32px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:16px;background:var(--bg);border-radius:4px}
.fill{height:100%;border-radius:4px}
.avgline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.val{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.s-high{--c:var(--hi)}.s-low{--c:var(--lo)}.s-zero{--c:var(--zero)}.s-ok{--c:var(--ok)}.s-short,.s-nokm{--c:var(--mute)}
.fill,.dot.c{background:var(--c)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);border:1px solid var(--c);white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{cursor:pointer;color:var(--mute);font-weight:600;user-select:none;position:sticky;top:0;background:var(--panel)}
th:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:10px}
.tools input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.msg{padding:30px;text-align:center;color:var(--mute)}
.err{color:var(--hi)}
@media print{
 :root,:root[data-theme=dark]{--bg:#fff;--panel:#fff;--line:#ccd6db;--ink:#12222c;--mute:#52666f;--accent:#0b7a75;--hi:#c93a2d;--lo:#a86b00;--zero:#4457c7;--ok:#1b8a57;--shadow:none}
 .btns,.filters-panel,.tools input,.noprint{display:none!important}
 body{font-size:12px}.wrap{padding:0;max-width:none}
 .panel,.kpi{break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div>
   <h1>ตรวจสอบการแจ้งเตือนอุปกรณ์เทียบระยะทางที่รถวิ่ง</h1>
   <div class="sub" id="stamp">กำลังโหลดข้อมูล...</div>
  </div>
  <div class="btns">
   <button class="btn" id="themeBtn" aria-label="สลับโหมดมืด/สว่าง" title="สลับโหมดมืด/สว่าง">
    <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
   </button>
   <button class="btn" id="reloadBtn">โหลดข้อมูลใหม่</button>
   <button class="btn primary" id="pdfBtn">ส่งออก PDF</button>
  </div>
 </header>

 <section class="panel filters-panel">
  <h2>ตัวกรองและเกณฑ์ตรวจสอบ</h2>
  <p class="hint">ค่าเฉลี่ยคำนวณจากรถที่วิ่งถึงระยะทางขั้นต่ำ แล้วเทียบรถแต่ละคันกับค่าเฉลี่ยนั้น</p>
  <div class="filters">
   <label>หน่วยงาน<select id="fFleet"></select></label>
   <label>ประเภทแจ้งเตือน<select id="fType"></select></label>
   <label>คำนวณต่อระยะทาง (กม.)<input id="fN" type="number" min="1" value="1000"></label>
   <label>ระยะทางขั้นต่ำที่นำมาประเมิน (กม.)<input id="fMin" type="number" min="0" value="500"></label>
   <label>เตือนมากเกินไป เมื่อเกิน (เท่าของค่าเฉลี่ย)<input id="fHi" type="number" min="1" step="0.1" value="1.5"></label>
   <label>เตือนน้อยเกินไป เมื่อต่ำกว่า (เท่า)<input id="fLo" type="number" min="0" max="1" step="0.1" value="0.5"></label>
  </div>
 </section>

 <div id="app"><div class="panel msg">กำลังโหลดข้อมูล...</div></div>
</div>

<script>
// ====== ตั้งค่า ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwW35lChBZEb8cKpt1TiAF2O9PyylzJaAnPorxloIpw5JTb515uicEETegQCPXmzH_Rsg/exec';
const COL = {
  m: {id:'Device No.', km:'Driving distance', fleet:'Fleet'},
  a: {id:'หมายเลขรถ', type:['ประเภทการเตือน','ประเภทแจ้งเตือน'], fleet:'หน่วยงาน'}
};
const STATUS = {
  high:['เตือนมากผิดปกติ'], low:['เตือนน้อยผิดปกติ'], zero:['ไม่เตือนเลย'],
  ok:['ปกติ'], short:['ระยะทางน้อย'], nokm:['ไม่มีข้อมูลระยะทาง']
};

// ====== ตัวช่วย ======
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.\-]/g,'')); return isFinite(n) ? n : 0; };
const fmt = (n,d=0) => n.toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const norm = s => String(s).trim().toLowerCase();
function field(row,name){
  if(Array.isArray(name)){
    for(const n of name){ const v = field(row,n); if(v !== '') return v; }
    return '';
  }
  if(name in row) return row[name];
  const k = Object.keys(row).find(k => norm(k) === norm(name));
  return k === undefined ? '' : row[k];
}
function pickSheet(root,name){
  if(!root || typeof root !== 'object') return null;
  const k = Object.keys(root).find(k => norm(k) === norm(name));
  return k && Array.isArray(root[k]) ? root[k] : null;
}
function extract(json){
  for(const r of [json, json.data, json.result]){
    const m = pickSheet(r,'Mileage'), a = pickSheet(r,'Alarm');
    if(m && a) return {mileage:m, alarm:a};
  }
  throw new Error('รูปแบบข้อมูลจาก API ไม่ตรงกับที่คาดไว้ ต้องมีทั้งชีต Mileage และ Alarm (ดูวิธีแก้โค้ด Apps Script)');
}

// ====== โหลดข้อมูล ======
let RAW = null, sortKey = 'rate', sortDir = -1, query = '';
async function load(){
  $('stamp').textContent = 'กำลังโหลดข้อมูล...';
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(json.status === 'error') throw new Error(json.message);
    RAW = extract(json);
    setupFilters();
    $('stamp').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleString('th-TH') +
      ' • ระยะทาง ' + fmt(RAW.mileage.length) + ' แถว • แจ้งเตือน ' + fmt(RAW.alarm.length) + ' รายการ';
    render();
  }catch(e){
    $('app').innerHTML = '<div class="panel msg err">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) +
      '<br><span class="sub">ตรวจสอบว่า Deploy เป็น Web App และตั้งผู้มีสิทธิ์เข้าถึงเป็น “ทุกคน”</span></div>';
    $('stamp').textContent = 'โหลดข้อมูลไม่สำเร็จ';
  }
}
function setupFilters(){
  const fleets = new Set(), types = new Set();
  RAW.mileage.forEach(r => { const f = String(field(r,COL.m.fleet)).trim(); if(f) fleets.add(f); });
  RAW.alarm.forEach(r => {
    const f = String(field(r,COL.a.fleet)).trim(); if(f) fleets.add(f);
    const t = String(field(r,COL.a.type)).trim(); if(t) types.add(t);
  });
  const keep = [$('fFleet').value, $('fType').value];
  $('fFleet').innerHTML = '<option value="">ทุกหน่วยงาน</option>' + [...fleets].sort().map(f => `<option>${esc(f)}</option>`).join('');
  $('fType').innerHTML = '<option value="">ทุกประเภท</option>' + [...types].sort().map(t => `<option>${esc(t)}</option>`).join('');
  $('fFleet').value = keep[0]; $('fType').value = keep[1];
}

// ====== คำนวณ ======
function compute(){
  const N = Math.max(1, num($('fN').value)), minKm = num($('fMin').value);
  const hi = num($('fHi').value), lo = num($('fLo').value);
  const fFleet = $('fFleet').value, fType = $('fType').value;
  const V = {};
  const get = id => V[id] || (V[id] = {id, fleet:'', km:0, alarms:0, types:{}});
  RAW.mileage.forEach(r => {
    const id = String(field(r,COL.m.id)).trim(); if(!id) return;
    const v = get(id); v.km += Math.max(0, num(field(r,COL.m.km))); // ค่าติดลบ (เลขไมล์รีเซ็ต) ไม่นำมาคิด
    const f = String(field(r,COL.m.fleet)).trim(); if(f) v.fleet = f;
  });
  RAW.alarm.forEach(r => {
    const id = String(field(r,COL.a.id)).trim(); if(!id) return;
    const t = String(field(r,COL.a.type)).trim() || '(ไม่ระบุ)';
    const v = get(id);
    if(!v.fleet){ const f = String(field(r,COL.a.fleet)).trim(); if(f) v.fleet = f; }
    if(fType && t !== fType) return;
    v.alarms++; v.types[t] = (v.types[t]||0) + 1;
  });
  let list = Object.values(V).filter(v => !fFleet || v.fleet === fFleet);
  const el = list.filter(v => v.km >= minKm && v.km > 0);
  const sumKm = el.reduce((s,v) => s + v.km, 0), sumAl = el.reduce((s,v) => s + v.alarms, 0);
  const avg = sumKm ? sumAl / sumKm * N : 0;
  list.forEach(v => {
    v.rate = v.km > 0 ? v.alarms / v.km * N : 0;
    v.ratio = avg ? v.rate / avg : 0;
    v.top = Object.entries(v.types).sort((a,b) => b[1]-a[1])[0];
    v.status = v.km <= 0 ? 'nokm' : v.km < minKm ? 'short' : v.alarms === 0 ? 'zero'
      : v.ratio > hi ? 'high' : v.ratio < lo ? 'low' : 'ok';
  });
  return {list, el, avg, N, sumKm, sumAl, minKm};
}

// ====== แสดงผล ======
function render(){
  if(!RAW) return;
  const D = compute(), {list, el, avg, N} = D;
  const cnt = s => list.filter(v => v.status === s).length;
  const abn = cnt('high') + cnt('low') + cnt('zero');
  const unit = 'ต่อ ' + fmt(N) + ' กม.';

  // แถบกราฟ: เรียงอัตราสูง→ต่ำ (รถที่ประเมินได้ แสดง 20 อันดับแรก)
  const ranked = el.slice().sort((a,b) => b.rate - a.rate).slice(0,20);
  const maxRate = Math.max(...ranked.map(v => v.rate), avg, 0.0001);
  const bars = ranked.map(v => `<div class="bar s-${v.status}">
    <div class="nm" title="${esc(v.id)}">${esc(v.id)}</div>
    <div class="track"><div class="fill" style="width:${v.rate/maxRate*100}%"></div><div class="avgline" style="left:${avg/maxRate*100}%"></div></div>
    <div class="val">${fmt(v.rate,2)}</div></div>`).join('');

  // สรุปตามหน่วยงาน
  const F = {};
  list.forEach(v => { const k = v.fleet || '(ไม่ระบุ)'; const f = F[k] || (F[k] = {n:0,km:0,al:0}); f.n++; f.km += v.km; f.al += v.alarms; });
  const fleetRows = Object.entries(F).map(([k,f]) => ({k, ...f, rate: f.km ? f.al/f.km*N : 0}))
    .sort((a,b) => b.rate - a.rate)
    .map(f => `<tr><td>${esc(f.k)}</td><td class="n">${f.n}</td><td class="n">${fmt(f.km)}</td><td class="n">${fmt(f.al)}</td><td class="n">${fmt(f.rate,2)}</td></tr>`).join('');

  // ประเภทแจ้งเตือนรวม
  const T = {}; list.forEach(v => Object.entries(v.types).forEach(([t,c]) => T[t] = (T[t]||0) + c));
  const tEntries = Object.entries(T).sort((a,b) => b[1]-a[1]).slice(0,10);
  const tMax = Math.max(...tEntries.map(e => e[1]), 1);
  const typeBars = tEntries.map(([t,c]) => `<div class="bar" style="grid-template-columns:130px 1fr 50px">
    <div class="nm" title="${esc(t)}">${esc(t)}</div><div class="track"><div class="fill" style="width:${c/tMax*100}%;background:var(--accent)"></div></div><div class="val">${fmt(c)}</div></div>`).join('') || '<div class="msg">ไม่มีข้อมูลแจ้งเตือน</div>';

  // รถที่ไม่เตือนเลย
  const zeros = list.filter(v => v.status === 'zero').sort((a,b) => b.km - a.km);
  const zeroChips = zeros.length ? zeros.map(v => `<span class="chip s-zero" title="${fmt(v.km)} กม.">${esc(v.id)}</span>`).join('')
    : '<span class="sub">ไม่มีรถที่ไม่เตือนเลย</span>';

  $('app').innerHTML = `
  <div class="kpis">
   <div class="kpi"><b>${fmt(list.length)}</b><span>จำนวนรถ</span></div>
   <div class="kpi"><b>${fmt(D.sumKm)}</b><span>ระยะทางรวม (กม.) ของรถที่ประเมิน</span></div>
   <div class="kpi"><b>${fmt(D.sumAl)}</b><span>จำนวนแจ้งเตือนของรถที่ประเมิน</span></div>
   <div class="kpi avg"><b>${fmt(avg,2)}</b><span>ค่าเฉลี่ย ${unit}</span></div>
   <div class="kpi"><b style="color:var(--hi)">${fmt(abn)}</b><span>รถที่ผิดปกติ (มาก ${cnt('high')} / น้อย ${cnt('low')} / ไม่เตือน ${cnt('zero')})</span></div>
  </div>

  <div class="grid2">
   <section class="panel">
    <h2>อัตราการแจ้งเตือน ${unit} สูงสุด 20 อันดับ</h2>
    <p class="hint">เส้นดำคือค่าเฉลี่ย รถที่แท่งยาวเกินเส้นมากคือเตือนถี่ผิดปกติ</p>
    ${bars || '<div class="msg">ไม่มีรถที่ถึงระยะทางขั้นต่ำ</div>'}
    <div class="legend">${['high','low','ok'].map(s => `<span class="s-${s}"><i class="dot c"></i>${STATUS[s][0]}</span>`).join('')}<span><i class="dot" style="background:var(--ink);width:2px"></i>ค่าเฉลี่ย</span></div>
   </section>
   <section class="panel">
    <h2>ประเภทแจ้งเตือนที่พบมากที่สุด</h2>
    <p class="hint">10 อันดับแรกของข้อมูลที่เลือก</p>
    ${typeBars}
   </section>
  </div>

  <div class="grid2">
   <section class="panel">
    <h2>รถที่ไม่เตือนเลย (วิ่งถึงเกณฑ์ขั้นต่ำ)</h2>
    <p class="hint">อาจเป็นอุปกรณ์เสีย สัญญาณขาด หรือไม่ได้ติดตั้ง ควรตรวจสอบ</p>
    <div class="chips">${zeroChips}</div>
   </section>
   <section class="panel">
    <h2>สรุปตามหน่วยงาน</h2>
    <p class="hint">เรียงตามอัตราแจ้งเตือน ${unit}</p>
    <div class="tw"><table><thead><tr><th>หน่วยงาน</th><th class="n">รถ</th><th class="n">กม.</th><th class="n">เตือน</th><th class="n">${unit}</th></tr></thead><tbody>${fleetRows}</tbody></table></div>
   </section>
  </div>

  <section class="panel">
   <div class="tools">
    <div><h2>รายละเอียดรายคัน</h2><p class="hint" style="margin:0">คลิกหัวตารางเพื่อเรียงลำดับ</p></div>
    <input id="q" type="search" placeholder="ค้นหาหมายเลขรถ / หน่วยงาน / สถานะ" value="${esc(query)}">
   </div>
   <div class="tw"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>`;

  $('q').addEventListener('input', e => { query = e.target.value; drawTable(list); });
  drawTable(list);
}

const COLS = [
  ['id','หมายเลขรถ',0], ['fleet','หน่วยงาน',0], ['km','ระยะทาง (กม.)',1], ['alarms','แจ้งเตือน (ครั้ง)',1],
  ['rate','อัตรา ต่อ N กม.',1], ['ratio','เทียบค่าเฉลี่ย (เท่า)',1], ['top','ประเภทที่เตือนมากสุด',0], ['status','สถานะ',0]
];
function drawTable(list){
  const q = norm(query);
  let rows = list.filter(v => !q || norm(v.id + ' ' + v.fleet + ' ' + STATUS[v.status][0]).includes(q));
  const val = v => sortKey === 'top' ? (v.top ? v.top[0] : '') : sortKey === 'status' ? STATUS[v.status][0] : v[sortKey];
  rows.sort((a,b) => {
    const x = val(a), y = val(b);
    return (typeof x === 'string' ? x.localeCompare(y,'th') : x - y) * sortDir;
  });
  $('thead').innerHTML = COLS.map(([k,t,n]) =>
    `<th class="${n?'n':''}" data-k="${k}">${t}${sortKey===k ? (sortDir>0?' ▲':' ▼') : ''}</th>`).join('');
  $('thead').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k==='id'||k==='fleet' ? 1 : -1); sortKey = k; drawTable(list);
  });
  $('tbody').innerHTML = rows.map(v => `<tr>
    <td><b>${esc(v.id)}</b></td><td>${esc(v.fleet || '-')}</td>
    <td class="n">${fmt(v.km)}</td><td class="n">${fmt(v.alarms)}</td>
    <td class="n">${v.km>0 ? fmt(v.rate,2) : '-'}</td>
    <td class="n">${v.status==='nokm'||v.status==='short' ? '-' : fmt(v.ratio,2)}</td>
    <td>${v.top ? esc(v.top[0]) + ' (' + v.top[1] + ')' : '-'}</td>
    <td><span class="chip s-${v.status}">${STATUS[v.status][0]}</span></td></tr>`).join('')
    || '<tr><td colspan="8" class="msg">ไม่พบข้อมูล</td></tr>';
}

// ====== ธีม / PDF / เหตุการณ์ ======
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('theme', t); }catch(e){}
}
(function(){
  let t = null;
  try{ t = localStorage.getItem('theme'); }catch(e){}
  setTheme(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();
$('themeBtn').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
$('reloadBtn').onclick = load;
// ส่งออก PDF: ใช้หน้าต่างพิมพ์ของเบราว์เซอร์ แล้วเลือกปลายทาง “บันทึกเป็น PDF”
$('pdfBtn').onclick = () => window.print();
['fFleet','fType','fN','fMin','fHi','fLo'].forEach(id => $(id).addEventListener('input', render));
load();
</script>
